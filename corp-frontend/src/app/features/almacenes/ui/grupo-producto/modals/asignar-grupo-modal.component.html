<app-modal [abierto]="abierto()" titulo="Agregar a grupo" ancho="lg" [hintF2]="true" (cerrar)="cerrar.emit()">
  <div class="flex flex-col gap-4 p-5">
    <p class="text-sm text-slate-600 dark:text-slate-300">
      Se moverán <span class="font-bold tabular-nums">{{ cantidad() }}</span>
      {{ cantidad() === 1 ? 'producto' : 'productos' }} al grupo que elijas.
      Los que ya tuvieran grupo cambiarán al nuevo.
    </p>

    <div>
      <label for="grupo-destino" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-500">
        Grupo destino
      </label>
      <select
        id="grupo-destino"
        [value]="idGrupo() ?? ''"
        (change)="elegir($event)"
        class="h-[42px] w-full cursor-pointer rounded-sm border-0 bg-white px-3.5 text-sm text-slate-900 shadow-sm outline outline-1 outline-slate-300 transition focus:outline-2 focus:outline-primary dark:bg-slate-800 dark:text-white dark:outline-slate-700"
      >
        <option value="">Seleccionar grupo</option>
        @for (grupo of grupos(); track grupo.idGrupo) {
          <option [value]="grupo.idGrupo">{{ grupo.nombre }} ({{ grupo.canal }})</option>
        }
      </select>
    </div>

    <div class="flex justify-end gap-2.5 border-t border-slate-200 pt-4 dark:border-slate-800">
      <button
        type="button"
        (click)="cerrar.emit()"
        class="inline-flex h-[42px] items-center gap-2 rounded-sm border border-slate-300 bg-white px-4 text-sm font-semibold text-slate-700 shadow-sm transition hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300"
      >
        <ng-icon name="lucideX" size="1rem" />
        Cancelar
      </button>
      <button
        type="button"
        (click)="confirmar()"
        [disabled]="idGrupo() === null"
        class="inline-flex h-[42px] items-center gap-2 rounded-sm bg-primary px-4 text-sm font-semibold text-white shadow-sm transition hover:bg-primary-hover focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
      >
        <ng-icon name="lucideCheck" size="1rem" />
        Agregar a grupo
      </button>
    </div>
  </div>
</app-modal>
