<div class="rounded-sm border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900">
  <div class="mb-3 flex items-center justify-between">
    <h3 class="text-sm font-bold uppercase tracking-wide text-slate-800 dark:text-white">Imagen</h3>
    @if (imagen()) {
      <button
        type="button"
        (click)="abrirZoom()"
        title="Ver imagen en tamaño completo"
        class="inline-flex items-center gap-1 rounded px-2 py-0.5 text-[11px] font-medium text-slate-500 transition hover:bg-slate-100 hover:text-primary dark:text-slate-400 dark:hover:bg-slate-800"
      >
        <ng-icon name="lucideMaximize2" size="0.85rem" />
        Ampliar
      </button>
    }
  </div>

  <div class="flex flex-col items-center gap-3">
    <div
      class="group relative flex max-h-[280px] min-h-[200px] w-full items-center justify-center overflow-hidden rounded-sm border border-slate-300 bg-slate-50 dark:border-slate-700 dark:bg-slate-800"
      [class.cursor-pointer]="imagen()"
      (click)="imagen() ? abrirZoom() : null"
    >
      @if (imagen(); as img) {
        <img [src]="img" alt="Producto" class="max-h-[280px] max-w-full object-contain transition group-hover:scale-[1.02]" />
        <div class="absolute inset-0 flex items-center justify-center bg-black/25 opacity-0 transition group-hover:opacity-100">
          <span class="inline-flex items-center gap-1 rounded-full bg-black/60 px-3 py-1 text-xs font-semibold text-white backdrop-blur-sm">
            <ng-icon name="lucideZoomIn" size="0.95rem" /> Clic para ampliar
          </span>
        </div>
      } @else {
        <span class="py-16 text-xs font-medium text-slate-400">Sin imagen</span>
      }
    </div>

    <div class="flex w-full flex-wrap gap-2">
      <label class="flex flex-1 cursor-pointer items-center justify-center gap-2 whitespace-nowrap rounded-sm bg-red-100 px-3 py-2 text-xs font-semibold text-red-600 transition hover:bg-red-200 dark:bg-red-900/30 dark:text-red-400">
        <ng-icon name="lucideUpload" size="1rem" /> Cargar
        <input type="file" accept="image/*" class="hidden" (change)="cargar($event)" />
      </label>
      <button
        type="button"
        (click)="guardar()"
        [disabled]="guardando() || (!archivoSeleccionado() && !imagen())"
        class="flex flex-1 items-center justify-center gap-2 whitespace-nowrap rounded-sm border border-slate-300 bg-white px-3 py-2 text-xs font-semibold text-slate-700 transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-50 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300"
      >
        <ng-icon name="lucideCheck" size="1rem" />
        @if (guardando()) {
          Guardando...
        } @else {
          Guardar
        }
      </button>
      <button
        type="button"
        (click)="eliminar()"
        [disabled]="guardando() || !imagen()"
        class="flex flex-1 items-center justify-center gap-2 whitespace-nowrap rounded-sm border border-slate-300 bg-white px-3 py-2 text-xs font-semibold text-slate-700 transition hover:bg-slate-50 hover:text-red-600 disabled:cursor-not-allowed disabled:opacity-50 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300"
      >
        <ng-icon name="lucideX" size="1rem" /> Eliminar
      </button>
    </div>
  </div>
</div>

<!-- ==========================================
     MODAL ZOOM / LIGHTBOX (modalImagenExpandida)
     ========================================== -->
@if (zoomAbierto(); as abierto) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4 backdrop-blur-sm animate-in fade-in duration-200"
    (click)="cerrarZoom()"
    role="dialog"
    aria-modal="true"
    aria-label="Imagen de producto ampliada"
  >
    <div
      class="relative flex max-h-[92vh] max-w-[92vw] flex-col items-center justify-center overflow-hidden rounded-lg bg-transparent shadow-2xl"
      (click)="$event.stopPropagation()"
    >
      <button
        type="button"
        (click)="cerrarZoom()"
        title="Cerrar (Esc)"
        aria-label="Cerrar imagen ampliada"
        class="absolute right-3 top-3 z-10 flex h-9 w-9 items-center justify-center rounded-full bg-black/60 text-white shadow-md transition hover:bg-black/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white"
      >
        <ng-icon name="lucideX" size="1.25rem" />
      </button>

      @if (imagen(); as img) {
        <img
          [src]="img"
          alt="Producto ampliado"
          class="max-h-[88vh] max-w-[88vw] rounded-md object-contain shadow-2xl"
        />
      }
    </div>
  </div>
}
