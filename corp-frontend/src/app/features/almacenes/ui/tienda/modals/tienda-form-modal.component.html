<app-modal [abierto]="abierto()" titulo="Agregar Tienda" ancho="2xl" [hintF2]="true" (cerrar)="cerrar.emit()">
  <form appEnterNavigate [formGroup]="formulario" class="flex flex-col">
    <div class="px-5 pt-3">
      <app-tabs [tabs]="tabs" [(activo)]="activa" />
    </div>

    @if (faltanGenerales()) {
      <p role="alert" class="mx-5 mt-3 rounded-sm bg-primary-light px-3.5 py-2 text-xs font-semibold text-primary">
        Faltan datos obligatorios en Datos Generales.
      </p>
    }

    <div class="flex max-h-[55vh] flex-col gap-4 overflow-y-auto p-5">
      @if (activa() === 'generales') {
        <div>
          <label for="tienda-codigo" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-500">
            Código <span class="text-primary">*</span>
          </label>
          <input
            id="tienda-codigo"
            type="text"
            formControlName="codigo"
            class="h-[42px] w-full rounded-sm border-0 bg-white px-3.5 text-sm text-slate-900 shadow-sm outline outline-1 outline-slate-300 transition focus:outline-2 focus:outline-primary dark:bg-slate-800 dark:text-white dark:outline-slate-700"
          />
        </div>

        <div>
          <label for="tienda-direccion" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-500">
            Dirección <span class="text-primary">*</span>
          </label>
          <input
            id="tienda-direccion"
            type="text"
            formControlName="direccion"
            class="h-[42px] w-full rounded-sm border-0 bg-white px-3.5 text-sm text-slate-900 shadow-sm outline outline-1 outline-slate-300 transition focus:outline-2 focus:outline-primary dark:bg-slate-800 dark:text-white dark:outline-slate-700"
          />
        </div>

        <div>
          <label for="tienda-empresa" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-500">
            Empresa <span class="text-primary">*</span>
          </label>
          <select
            id="tienda-empresa"
            formControlName="idEmpresa"
            class="h-[42px] w-full cursor-pointer rounded-sm border-0 bg-white px-3.5 text-sm text-slate-900 shadow-sm outline outline-1 outline-slate-300 transition focus:outline-2 focus:outline-primary dark:bg-slate-800 dark:text-white dark:outline-slate-700"
          >
            <option value="">Seleccionar</option>
            @for (empresa of empresas(); track empresa.idEmpresa) {
              <option [value]="empresa.idEmpresa">{{ empresa.razonSocial }}</option>
            }
          </select>
        </div>

        <div>
          <label for="tienda-envio" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-500">
            Empresa de envío <span class="text-primary">*</span>
          </label>
          <select
            id="tienda-envio"
            formControlName="idEmpresaEnvio"
            class="h-[42px] w-full cursor-pointer rounded-sm border-0 bg-white px-3.5 text-sm text-slate-900 shadow-sm outline outline-1 outline-slate-300 transition focus:outline-2 focus:outline-primary dark:bg-slate-800 dark:text-white dark:outline-slate-700"
          >
            <option value="">Seleccione empresa</option>
            @for (empresa of empresas(); track empresa.idEmpresa) {
              <option [value]="empresa.idEmpresa">{{ empresa.razonSocial }}</option>
            }
          </select>
        </div>

        <div>
          <label for="tienda-ubigeo" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-500">
            Ubigeo <span class="text-primary">*</span>
          </label>
          <input
            id="tienda-ubigeo"
            type="text"
            formControlName="ubigeo"
            placeholder="ESCRIBA EL DEPARTAMENTO..."
            class="h-[42px] w-full rounded-sm border-0 bg-white px-3.5 text-sm text-slate-900 shadow-sm outline outline-1 outline-slate-300 transition placeholder:text-slate-400 focus:outline-2 focus:outline-primary dark:bg-slate-800 dark:text-white dark:outline-slate-700"
          />
        </div>
      } @else {
        <div class="grid gap-4 sm:grid-cols-2">
          <div>
            <label for="tienda-serie" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-500">
              Serie
            </label>
            <input
              id="tienda-serie"
              type="text"
              formControlName="serie"
              class="h-[42px] w-full rounded-sm border-0 bg-white px-3.5 text-sm tabular-nums text-slate-900 shadow-sm outline outline-1 outline-slate-300 transition focus:outline-2 focus:outline-primary dark:bg-slate-800 dark:text-white dark:outline-slate-700"
            />
          </div>

          <div>
            <label for="tienda-impresiones" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-500">
              Cant. impresiones
            </label>
            <input
              id="tienda-impresiones"
              type="number"
              min="1"
              formControlName="cantidadImpresiones"
              class="h-[42px] w-full rounded-sm border-0 bg-white px-3.5 text-sm tabular-nums text-slate-900 shadow-sm outline outline-1 outline-slate-300 transition focus:outline-2 focus:outline-primary dark:bg-slate-800 dark:text-white dark:outline-slate-700"
            />
          </div>
        </div>

        <div>
          <label for="tienda-canal" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-500">
            Canal
          </label>
          <select
            id="tienda-canal"
            formControlName="idCanal"
            class="h-[42px] w-full cursor-pointer rounded-sm border-0 bg-white px-3.5 text-sm text-slate-900 shadow-sm outline outline-1 outline-slate-300 transition focus:outline-2 focus:outline-primary dark:bg-slate-800 dark:text-white dark:outline-slate-700"
          >
            <option value="">Seleccionar</option>
            @for (canal of canales(); track canal.idCanal) {
              <option [value]="canal.idCanal">{{ canal.nombre }}</option>
            }
          </select>
        </div>

        <label class="flex items-center gap-2.5 text-sm text-slate-700 dark:text-slate-300">
          <input type="checkbox" formControlName="manejaStock" class="h-4 w-4 cursor-pointer accent-primary" />
          Descuenta stock al vender
        </label>

        <label class="flex items-center gap-2.5 text-sm text-slate-700 dark:text-slate-300">
          <input type="checkbox" formControlName="activo" class="h-4 w-4 cursor-pointer accent-primary" />
          Tienda activa
        </label>
      }
    </div>

    <div class="flex justify-end gap-2.5 border-t border-slate-200 px-5 py-3.5 dark:border-slate-800">
      <button
        type="button"
        (click)="cerrar.emit()"
        class="inline-flex h-[42px] items-center gap-2 rounded-sm border border-slate-300 bg-white px-4 text-sm font-semibold text-slate-700 shadow-sm transition hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300"
      >
        <ng-icon name="lucideX" size="1rem" />
        Cancelar
      </button>
      <button
        type="button"
        (click)="confirmar()"
        class="inline-flex h-[42px] items-center gap-2 rounded-sm bg-primary px-4 text-sm font-semibold text-white shadow-sm transition hover:bg-primary-hover focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2"
      >
        <ng-icon name="lucideCheck" size="1rem" />
        Guardar cambios
      </button>
    </div>
  </form>
</app-modal>
