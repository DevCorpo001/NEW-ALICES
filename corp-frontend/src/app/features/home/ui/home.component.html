<section class="space-y-6">
  <div
    class="flex flex-col gap-4 rounded-lg border border-slate-200 bg-white p-6 shadow-sm sm:flex-row sm:items-center sm:justify-between dark:border-slate-800 dark:bg-slate-900"
  >
    <div>
      <p class="text-sm font-semibold uppercase tracking-[0.2em] text-primary">ALICES</p>
      <h2 class="mt-2 text-2xl font-semibold tracking-tight text-slate-900 dark:text-white">
        Bienvenido, {{ auth.user()?.nombre }}
      </h2>
      <p class="mt-1 text-sm text-slate-600 dark:text-slate-400">
        Sesión iniciada como {{ auth.user()?.rolNombre }}.
      </p>
    </div>
  </div>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-3">
    @for (modulo of modulos; track modulo.route) {
      <a
        [routerLink]="modulo.route"
        class="group rounded-lg border border-slate-200 bg-white p-5 shadow-sm transition hover:border-primary hover:shadow-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary dark:border-slate-800 dark:bg-slate-900"
      >
        <span
          class="inline-flex h-11 w-11 items-center justify-center rounded-lg bg-primary-light text-primary transition group-hover:bg-primary group-hover:text-white dark:bg-slate-800 dark:text-primary-light dark:group-hover:bg-primary dark:group-hover:text-white"
        >
          <ng-icon name="{{ modulo.icon }}" size="1.25rem" aria-hidden="true" />
        </span>
        <p class="mt-4 text-base font-semibold text-slate-900 dark:text-white">{{ modulo.titulo }}</p>
        <p class="mt-1 text-sm text-slate-600 dark:text-slate-400">{{ modulo.descripcion }}</p>
      </a>
    }
  </div>
</section>
