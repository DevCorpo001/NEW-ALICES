<section class="flex h-full min-h-0 flex-col gap-3 bg-slate-50 py-1 dark:bg-slate-950">
  <div class="shrink-0 px-4 max-[576px]:px-2">
    <app-tabs [tabs]="tabs()" [(activo)]="activa" />
  </div>

  @if (activa() === 'claves') {
    <div role="tabpanel" id="panel-claves" aria-labelledby="tab-claves" class="flex-1 min-h-0 overflow-hidden">
      <app-claves-tab class="block h-full min-h-0" />
    </div>
  } @else {
    <div role="tabpanel" id="panel-qr" aria-labelledby="tab-qr" class="flex-1 min-h-0 overflow-hidden">
      <app-claves-qr-tab class="block h-full min-h-0" />
    </div>
  }
</section>
