<section class="h-full flex flex-col gap-2 min-h-0 bg-slate-50 dark:bg-slate-950 overflow-hidden">
  <div class="shrink-0 px-2 sm:px-4">
    <app-tabs [tabs]="tabs()" [(activo)]="activa" />
  </div>

  @if (activa() === 'usuarios') {
    <div role="tabpanel" id="panel-usuarios" aria-labelledby="tab-usuarios" class="flex-1 min-h-0 flex flex-col overflow-hidden">
      <app-usuarios-tab />
    </div>
  } @else {
    <div role="tabpanel" id="panel-roles" aria-labelledby="tab-roles" class="flex-1 min-h-0 flex flex-col overflow-hidden">
      <app-roles-tab />
    </div>
  }
</section>
