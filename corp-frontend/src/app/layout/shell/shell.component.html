<a

>
  Saltar al contenido

<app-sidebar [isOpen]="open()" (closed)="closeMenu()" />

<div
  class="flex min-h-screen flex-col bg-surface text-slate-900 transition-colors dark:bg-slate-950 dark:text-slate-100"
>
  <app-topbar [menuExpanded]="open()" (menuToggled)="toggleMenu()" />

  <main
    id="contenido-principal"
    class="mx-auto w-full max-w-[1440px] flex-1 px-4 py-6 pb-16 sm:px-6 lg:px-8"
  >
    <router-outlet />
  </main>
</div>

<app-marquee [text]="marqueeMessage" />
