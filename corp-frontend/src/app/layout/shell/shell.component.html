<a
  href="#contenido-principal"
  class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[60] focus:rounded-lg focus:bg-white focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-slate-900 focus:shadow-lg"
>
  Saltar al contenido
</a>

<app-sidebar [isOpen]="open()" (closed)="closeMenu()" />

<div
  class="flex h-screen h-dvh flex-col overflow-hidden bg-slate-50 text-slate-900 transition-colors dark:bg-slate-950 dark:text-slate-100"
>
  <app-topbar [menuExpanded]="open()" (menuToggled)="toggleMenu()" class="shrink-0" />

  <main
    id="contenido-principal"
    class="flex-1 min-h-0 w-full overflow-hidden flex flex-col px-3 py-2 sm:px-5 sm:py-2.5 lg:px-6"
  >
    <router-outlet />
  </main>

  <app-marquee
    class="shrink-0"
    [mensajes]="footer.textos()"
    [colorTexto]="footer.colorTexto()"
    [colorFondo]="footer.colorFondo()"
  />
</div>
