<header
  class="sticky top-0 z-30 border-b border-slate-200/80 bg-white/80 backdrop-blur-md transition-colors dark:border-slate-800 dark:bg-slate-900/80"
>
  <div class="flex h-16 items-center gap-3 px-4 sm:px-6 lg:px-8">
    <button
      #menuButton
      type="button"
      (click)="menuToggled.emit()"
      aria-label="Abrir menú"
      [attr.aria-expanded]="menuExpanded()"
      class="rounded-lg p-2 text-slate-600 transition hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary dark:text-slate-300 dark:hover:bg-slate-800 lg:hidden"
    >
      <ng-icon name="lucideMenu" size="1.5rem" />
    </button>

    <h1 class="truncate text-lg font-semibold tracking-tight text-slate-900 dark:text-white">
      {{ pageTitle() || 'ALICES' }}
    </h1>

    <div class="ml-auto flex items-center gap-1 sm:gap-2">
      <button
        type="button"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
        class="rounded-lg p-2 text-slate-600 transition hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary dark:text-slate-300 dark:hover:bg-slate-800"
      >
        <ng-icon [name]="theme.isDark() ? 'lucideSun' : 'lucideMoon'" size="1.25rem" />
      </button>

      <button
        type="button"
        aria-label="Notificaciones"
        class="relative rounded-lg p-2 text-slate-600 transition hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary dark:text-slate-300 dark:hover:bg-slate-800"
      >
        <ng-icon name="lucideBell" size="1.25rem" />
        <span
          class="absolute right-1.5 top-1.5 h-2 w-2 rounded-full bg-primary ring-2 ring-white dark:ring-slate-900"
          aria-hidden="true"
        ></span>
      </button>

      <span class="mx-1 hidden h-6 w-px bg-slate-200 dark:bg-slate-700 sm:block" aria-hidden="true"></span>

      <div class="hidden items-center gap-2.5 pl-1 sm:flex">
        <span
          class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-primary text-xs font-bold text-white"
          aria-hidden="true"
        >
          {{ auth.user()?.nombre?.charAt(0)?.toUpperCase() ?? 'U' }}
        </span>
        <div class="hidden leading-tight lg:block">
          <p class="text-sm font-semibold text-slate-900 dark:text-white">{{ auth.user()?.nombre ?? 'Usuario' }}</p>
          <p class="text-xs text-slate-500 dark:text-slate-400">{{ auth.user()?.rolNombre ?? '' }}</p>
        </div>
      </div>

      <button
        type="button"
        (click)="logout()"
        aria-label="Cerrar sesión"
        title="Cerrar sesión"
        class="rounded-lg p-2 text-slate-600 transition hover:bg-slate-100 hover:text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-primary-light"
      >
        <ng-icon name="lucideLogOut" size="1.25rem" />
      </button>
    </div>
  </div>
</header>
