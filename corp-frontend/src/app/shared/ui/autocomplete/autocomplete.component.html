@if (etiqueta()) {
  <label [for]="idControl()" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-500">
    {{ etiqueta() }}
  </label>
}

<input
  #campo
  cdkOverlayOrigin
  #origen="cdkOverlayOrigin"
  [id]="idControl()"
  type="text"
  role="combobox"
  autocomplete="off"
  aria-autocomplete="list"
  [attr.aria-expanded]="abierto()"
  [attr.aria-controls]="abierto() ? idPanel() : null"
  [attr.aria-activedescendant]="abierto() ? idOpcionActiva() : null"
  [value]="valor()"
  [disabled]="deshabilitado()"
  [placeholder]="placeholder()"
  [class.uppercase]="mayusculas()"
  (input)="onInput($event)"
  (keydown)="onKeydown($event)"
  (focus)="onFocus()"
  (blur)="cerrar()"
  class="h-[42px] w-full rounded-sm border-0 bg-white px-3.5 text-sm text-slate-900 shadow-sm outline outline-1 outline-slate-300 transition placeholder:text-slate-400 focus:outline-2 focus:outline-primary disabled:cursor-not-allowed disabled:opacity-60 dark:bg-slate-800 dark:text-white dark:outline-slate-700"
/>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origen"
  [cdkConnectedOverlayOpen]="abierto()"
  [cdkConnectedOverlayWidth]="anchoPanel()"
  [cdkConnectedOverlayViewportMargin]="8"
  [cdkConnectedOverlayPositions]="[
    { originX: 'start', originY: 'bottom', overlayX: 'start', overlayY: 'top', offsetY: 4 },
    { originX: 'start', originY: 'top', overlayX: 'start', overlayY: 'bottom', offsetY: -4 }
  ]"
  (overlayOutsideClick)="cerrar()"
  (detach)="cerrar()"
>
  <div
    class="overflow-hidden rounded-sm border border-slate-200 bg-white shadow-lg dark:border-slate-800 dark:bg-slate-900"
  >
    @if (buscando()) {
      <p class="flex items-center gap-2 px-3.5 py-2.5 text-xs text-slate-500" role="status">
        <ng-icon name="lucideLoaderCircle" size="1rem" class="animate-spin" />
        Buscando...
      </p>
    } @else if (error()) {
      <p class="px-3.5 py-2.5 text-xs font-semibold text-red-600" role="alert">{{ mensajeError() }}</p>
    } @else if (!hayOpciones()) {
      <p class="px-3.5 py-2.5 text-xs text-slate-500" role="status">{{ mensajeVacio() }}</p>
    } @else {
      <ul
        [id]="idPanel()"
        role="listbox"
        [attr.aria-label]="etiqueta() || 'Resultados'"
        class="max-h-[264px] overflow-y-auto py-1"
      >
        @for (opcion of opciones(); track opcion.clave; let i = $index) {
          <li
            [id]="idControl() + '-opcion-' + opcion.clave"
            role="option"
            [attr.aria-selected]="indiceActivo() === i"
          >
            <button
              type="button"
              tabindex="-1"
              (mousedown)="$event.preventDefault()"
              (click)="elegir(opcion)"
              (mouseenter)="activar(i)"
              [class.bg-primary]="indiceActivo() === i"
              [class.text-white]="indiceActivo() === i"
              [class.hover:bg-slate-200]="indiceActivo() !== i"
              [class.dark:hover:bg-slate-700]="indiceActivo() !== i"
              class="flex w-full items-center gap-2.5 px-3.5 py-2 text-left text-sm text-slate-700 transition focus-visible:outline-none dark:text-slate-300"
            >
              <span class="shrink-0 font-semibold">{{ opcion.principal }}</span>
              @if (opcion.secundario) {
                <span class="truncate">{{ opcion.secundario }}</span>
              }
              @if (opcion.etiqueta) {
                <span class="ml-auto shrink-0 text-xs font-semibold text-red-500">{{ opcion.etiqueta }}</span>
              }
            </button>
          </li>
        }
      </ul>
    }
  </div>
</ng-template>
