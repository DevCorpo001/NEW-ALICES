<button
  type="button"
  cdkOverlayOrigin
  #origen="cdkOverlayOrigin"
  (click)="abierto() ? cerrar() : abrir()"
  [attr.aria-expanded]="abierto()"
  aria-haspopup="true"
  class="inline-flex h-[42px] items-center gap-2 whitespace-nowrap rounded-sm border border-slate-300 bg-white px-4 text-sm font-semibold text-slate-700 shadow-sm transition hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700"
>
  <ng-icon name="lucideColumns3" size="1rem" />
  {{ etiqueta() }}
  @if (!todasVisibles()) {
    <span class="rounded-sm bg-primary-light px-1.5 py-0.5 text-[11px] font-bold tabular-nums text-primary">
      {{ visibles() }}/{{ columnas().length }}
    </span>
  }
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origen"
  [cdkConnectedOverlayOpen]="abierto()"
  [cdkConnectedOverlayViewportMargin]="8"
  [cdkConnectedOverlayPositions]="[
    { originX: 'end', originY: 'bottom', overlayX: 'end', overlayY: 'top', offsetY: 4 },
    { originX: 'end', originY: 'top', overlayX: 'end', overlayY: 'bottom', offsetY: -4 }
  ]"
  (overlayOutsideClick)="cerrar()"
  (detach)="cerrar()"
>
  <div
    (keydown)="onKeydownPanel($event)"
    class="w-60 rounded-sm border border-slate-200 bg-white py-1.5 shadow-xl dark:border-slate-700 dark:bg-slate-900"
  >
    <div class="flex items-center justify-between gap-2 px-3 pb-1.5 pt-1">
      <span class="text-[11px] font-bold uppercase tracking-wide text-slate-400">
        Mostrar columnas
      </span>
      <button
        type="button"
        (click)="mostrarTodas()"
        [disabled]="todasVisibles()"
        class="rounded-sm px-1.5 py-0.5 text-xs font-semibold text-primary transition hover:bg-primary-light focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary disabled:cursor-not-allowed disabled:text-slate-300 disabled:hover:bg-transparent dark:disabled:text-slate-600"
      >
        Todas
      </button>
    </div>

    <div class="max-h-72 overflow-y-auto">
      @for (columna of columnas(); track columna.campo) {
        <label
          class="flex cursor-pointer items-center gap-2.5 px-3 py-1.5 text-sm text-slate-700 transition hover:bg-slate-50 dark:text-slate-300 dark:hover:bg-slate-800"
        >
          <input
            type="checkbox"
            [checked]="esVisible(columna.campo)"
            (change)="alternar(columna.campo)"
            class="h-4 w-4 shrink-0 cursor-pointer accent-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
          />
          <span class="truncate">{{ columna.titulo }}</span>
        </label>
      }
    </div>
  </div>
</ng-template>
