@if (abierto()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="fixed inset-0 bg-slate-950/60" aria-hidden="true" (click)="cerrar.emit()"></div>

    <div
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="titulo()"
      class="relative w-full rounded-md border border-slate-200 bg-white shadow-xl outline-none {{ anchoClass() }} dark:border-slate-700 dark:bg-slate-900"
    >
      <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 px-5 py-3.5 dark:border-slate-800">
        <div class="flex min-w-0 flex-1 flex-wrap items-center gap-2.5">
          <h2 class="truncate text-sm font-bold uppercase tracking-wide text-slate-800 dark:text-white">{{ titulo() }}</h2>
          @if (hintF2()) {
            <span class="shrink-0 rounded bg-slate-100 px-1.5 py-0.5 text-[10px] font-bold uppercase tracking-wide text-slate-500 dark:bg-slate-800 dark:text-slate-400">F2 Cerrar</span>
          }
          @if (usuario()) {
            <div class="flex shrink-0 items-center gap-1.5">
              <span class="text-[10px] font-bold uppercase tracking-wide text-slate-400 dark:text-slate-500">Usuario</span>
              <input
                type="text"
                [value]="usuario()"
                readonly
                tabindex="-1"
                class="h-7 w-36 cursor-not-allowed rounded border border-slate-200 bg-slate-100 px-2 text-xs font-medium text-slate-600 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300"
              />
            </div>
          }
        </div>
        <button
          type="button"
          aria-label="Cerrar"
          (click)="cerrar.emit()"
          class="flex h-8 w-8 shrink-0 items-center justify-center rounded text-slate-400 transition hover:bg-slate-100 hover:text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary dark:hover:bg-slate-800"
        >
          <ng-icon name="lucideX" size="1rem" />
        </button>
      </div>
      <ng-content />
    </div>
  </div>
}
