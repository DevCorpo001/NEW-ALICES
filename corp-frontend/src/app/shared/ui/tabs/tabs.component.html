<div
  role="tablist"
  (keydown)="onKeydown($event)"
  class="flex gap-1 border-b border-slate-200 dark:border-slate-800"
>
  @for (tab of tabs(); track tab.id) {
    <button
      type="button"
      role="tab"
      [id]="idTab(tab.id)"
      [attr.aria-selected]="tab.id === activo()"
      [attr.aria-controls]="idPanel(tab.id)"
      [tabindex]="tab.id === activo() ? 0 : -1"
      (click)="seleccionar(tab.id)"
      class="-mb-px inline-flex items-center gap-2 whitespace-nowrap border-b-2 px-5 py-3 text-[15px] font-semibold transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
      [class.border-primary]="tab.id === activo()"
      [class.text-primary]="tab.id === activo()"
      [class.border-transparent]="tab.id !== activo()"
      [class.text-slate-500]="tab.id !== activo()"
      [class.hover:text-slate-800]="tab.id !== activo()"
      [class.dark:hover:text-slate-200]="tab.id !== activo()"
    >
      @if (tab.icono) {
        <ng-icon [name]="tab.icono" size="1.05rem" />
      }
      {{ tab.etiqueta }}
      @if (tab.contador !== undefined) {
        <span
          class="rounded-sm px-1.5 py-0.5 text-[11px] font-bold tabular-nums"
          [class.bg-primary-light]="tab.id === activo()"
          [class.text-primary]="tab.id === activo()"
          [class.bg-slate-100]="tab.id !== activo()"
          [class.text-slate-500]="tab.id !== activo()"
          [class.dark:bg-slate-800]="tab.id !== activo()"
        >
          {{ tab.contador }}
        </span>
      }
    </button>
  }
</div>
